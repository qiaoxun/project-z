<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e8f4f8 0%, #d4e8f2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        .game-container {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .board-wrapper {
            --board: min(calc(100vw - 226px), calc(100vh - 20px));
            width: var(--board);
            height: var(--board);
            background: #dcb35c;
            padding: 14px;
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            flex-shrink: 0;
        }

        #board {
            display: grid;
            gap: 0;
            width: 100%;
            height: 100%;
            background: #dcb35c;
            position: relative;
        }

        .cell {
            position: relative;
            cursor: pointer;
        }

        .cell::before {
            content: '';
            position: absolute;
            background: #8b6914;
        }

        .cell::after {
            content: '';
            position: absolute;
            background: #8b6914;
        }

        .cell::before {
            width: 100%;
            height: 1px;
            top: 50%;
            left: 0;
        }

        .cell::after {
            width: 1px;
            height: 100%;
            left: 50%;
            top: 0;
        }

        /* Edge cells */
        .cell.top::after { height: 50%; top: 50%; }
        .cell.bottom::after { height: 50%; }
        .cell.left::before { width: 50%; left: 50%; }
        .cell.right::before { width: 50%; }

        /* Star points */
        .cell.star-point::before {
            content: '';
            position: absolute;
            width: 24%;
            height: 24%;
            background: #8b6914;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
        }

        .stone {
            position: absolute;
            width: 92%;
            height: 92%;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
            transition: transform 0.1s ease;
        }

        .stone.black {
            background: radial-gradient(circle at 30% 30%, #4a4a4a, #000);
            box-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .stone.white {
            background: radial-gradient(circle at 30% 30%, #fff, #ccc);
            box-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .cell:hover .preview {
            opacity: 0.5;
        }

        .preview {
            opacity: 0;
            pointer-events: none;
        }

        .sidebar {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 10px;
            border-radius: 10px;
            color: #333;
            width: 180px;
            flex-shrink: 0;
            font-size: 0.85em;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-size: 1.2em;
            margin-bottom: 8px;
            text-align: center;
        }

        .turn-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            padding: 6px 8px;
            background: rgba(0, 0, 0, 0.05);
            border-radius: 6px;
        }

        .turn-stone {
            width: 16px;
            height: 16px;
            border-radius: 50%;
        }

        .turn-stone.black {
            background: radial-gradient(circle at 30% 30%, #4a4a4a, #000);
        }

        .turn-stone.white {
            background: radial-gradient(circle at 30% 30%, #fff, #ccc);
        }

        .captures {
            margin-bottom: 8px;
        }

        .capture-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 8px;
            background: rgba(0, 0, 0, 0.05);
            border-radius: 6px;
            margin-bottom: 4px;
        }

        .capture-stone {
            width: 14px;
            height: 14px;
            border-radius: 50%;
        }

        .capture-stone.black {
            background: radial-gradient(circle at 30% 30%, #4a4a4a, #000);
        }

        .capture-stone.white {
            background: radial-gradient(circle at 30% 30%, #fff, #ccc);
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        button {
            padding: 6px 8px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9em;
            transition: transform 0.1s, background 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        .btn-pass {
            background: #f39c12;
            color: white;
        }

        .btn-pass:hover {
            background: #e67e22;
        }

        .btn-reset {
            background: #e74c3c;
            color: white;
        }

        .btn-reset:hover {
            background: #c0392b;
        }

        .btn-size {
            background: #3498db;
            color: white;
        }

        .btn-size:hover {
            background: #2980b9;
        }

        .btn-nav {
            background: #9b59b6;
            color: white;
        }

        .btn-nav:hover {
            background: #8e44ad;
        }

        .btn-nav:disabled {
            background: #bdc3c7;
            cursor: not-allowed;
            transform: none;
        }

        .nav-controls {
            display: flex;
            gap: 6px;
            margin-bottom: 6px;
        }

        .nav-controls button {
            flex: 1;
            white-space: nowrap;
        }

        .size-selector {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
        }

        .size-selector button {
            flex: 1;
            padding: 5px 2px;
            font-size: 0.85em;
        }

        .size-selector button.active {
            background: #27ae60;
        }

        .game-over {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .game-over-content {
            background: white;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            color: #333;
        }

        .game-over h2 {
            margin-bottom: 20px;
            font-size: 2em;
        }

        .game-over p {
            margin-bottom: 20px;
            font-size: 1.2em;
        }

        .hidden {
            display: none !important;
        }

        .last-move {
            box-shadow: 0 0 0 3px #e74c3c !important;
        }

        .instructions {
            margin-top: 8px;
            padding: 8px;
            background: rgba(0, 0, 0, 0.05);
            border-radius: 6px;
            font-size: 0.85em;
            line-height: 1.4;
        }

        .instructions h3 {
            margin-bottom: 4px;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="board-wrapper">
            <div id="board"></div>
        </div>
        <div class="sidebar">
            <h1>Go</h1>

            <div class="size-selector">
                <button class="btn-size" data-size="9">9x9</button>
                <button class="btn-size active" data-size="13">13x13</button>
                <button class="btn-size" data-size="19">19x19</button>
            </div>

            <div class="turn-indicator">
                <div class="turn-stone" id="turn-stone"></div>
                <span id="turn-text">Black's turn</span>
            </div>

            <div class="captures">
                <div class="capture-row">
                    <div class="capture-stone black"></div>
                    <span>Captured: <span id="black-captures">0</span></span>
                </div>
                <div class="capture-row">
                    <div class="capture-stone white"></div>
                    <span>Captured: <span id="white-captures">0</span></span>
                </div>
            </div>

            <div class="controls">
                <div class="nav-controls">
                    <button class="btn-nav" id="prev-btn" disabled>&#9664; Previous</button>
                    <button class="btn-nav" id="next-btn" disabled>Next &#9654;</button>
                </div>
                <button class="btn-pass" id="pass-btn">Pass</button>
                <button class="btn-reset" id="reset-btn">New Game</button>
            </div>

            <div class="instructions">
                <h3>How to Play</h3>
                <p>Click to place stones. Surround opponent stones to capture them. Two consecutive passes end the game.</p>
            </div>
        </div>
    </div>

    <div id="game-over" class="game-over hidden">
        <div class="game-over-content">
            <h2>Game Over</h2>
            <p id="game-result"></p>
            <button class="btn-reset" id="new-game-btn">New Game</button>
        </div>
    </div>

    <script>
        class GoGame {
            constructor(size = 13) {
                this.size = size;
                this.board = [];
                this.currentPlayer = 'black';
                this.captures = { black: 0, white: 0 };
                this.lastMove = null;
                this.koPoint = null;
                this.passCount = 0;
                this.stateHistory = [];
                this.historyIndex = -1;
                this.init();
            }

            init() {
                this.board = Array(this.size).fill(null).map(() => Array(this.size).fill(null));
                this.currentPlayer = 'black';
                this.captures = { black: 0, white: 0 };
                this.lastMove = null;
                this.koPoint = null;
                this.passCount = 0;
                this.stateHistory = [];
                this.historyIndex = -1;
                this.saveState();
                this.renderBoard();
                this.updateUI();
            }

            saveState() {
                const state = {
                    board: JSON.parse(JSON.stringify(this.board)),
                    currentPlayer: this.currentPlayer,
                    captures: { ...this.captures },
                    lastMove: this.lastMove ? { ...this.lastMove } : null,
                    koPoint: this.koPoint ? { ...this.koPoint } : null,
                    passCount: this.passCount
                };

                // Remove any future states if we're not at the end
                this.stateHistory = this.stateHistory.slice(0, this.historyIndex + 1);
                this.stateHistory.push(state);
                this.historyIndex = this.stateHistory.length - 1;
                this.updateNavButtons();
            }

            loadState(index) {
                if (index < 0 || index >= this.stateHistory.length) return;

                const state = this.stateHistory[index];
                this.board = JSON.parse(JSON.stringify(state.board));
                this.currentPlayer = state.currentPlayer;
                this.captures = { ...state.captures };
                this.lastMove = state.lastMove ? { ...state.lastMove } : null;
                this.koPoint = state.koPoint ? { ...state.koPoint } : null;
                this.passCount = state.passCount;
                this.historyIndex = index;

                this.updateUI();
                this.updateBoardDisplay();
                this.updateNavButtons();
            }

            previousMove() {
                if (this.historyIndex > 0) {
                    this.loadState(this.historyIndex - 1);
                }
            }

            nextMove() {
                if (this.historyIndex < this.stateHistory.length - 1) {
                    this.loadState(this.historyIndex + 1);
                }
            }

            updateNavButtons() {
                const prevBtn = document.getElementById('prev-btn');
                const nextBtn = document.getElementById('next-btn');
                if (prevBtn) prevBtn.disabled = this.historyIndex <= 0;
                if (nextBtn) nextBtn.disabled = this.historyIndex >= this.stateHistory.length - 1;
            }

            renderBoard() {
                const boardEl = document.getElementById('board');
                boardEl.innerHTML = '';
                boardEl.style.gridTemplateColumns = `repeat(${this.size}, 1fr)`;
                boardEl.style.gridTemplateRows = `repeat(${this.size}, 1fr)`;

                const starPoints = this.getStarPoints();

                for (let y = 0; y < this.size; y++) {
                    for (let x = 0; x < this.size; x++) {
                        const cell = document.createElement('div');
                        cell.className = 'cell';
                        cell.dataset.x = x;
                        cell.dataset.y = y;

                        // Add edge classes
                        if (y === 0) cell.classList.add('top');
                        if (y === this.size - 1) cell.classList.add('bottom');
                        if (x === 0) cell.classList.add('left');
                        if (x === this.size - 1) cell.classList.add('right');

                        // Add star point
                        if (starPoints.some(p => p.x === x && p.y === y)) {
                            cell.classList.add('star-point');
                        }

                        // Add preview stone
                        const preview = document.createElement('div');
                        preview.className = `stone preview ${this.currentPlayer}`;
                        cell.appendChild(preview);

                        cell.addEventListener('click', () => this.handleClick(x, y));
                        cell.addEventListener('mouseenter', () => this.handleHover(cell));
                        cell.addEventListener('mouseleave', () => this.handleHoverEnd(cell));

                        boardEl.appendChild(cell);
                    }
                }

                this.updateBoardDisplay();
            }

            getStarPoints() {
                const points = [];
                if (this.size === 9) {
                    points.push({ x: 2, y: 2 }, { x: 6, y: 2 }, { x: 2, y: 6 }, { x: 6, y: 6 }, { x: 4, y: 4 });
                } else if (this.size === 13) {
                    points.push(
                        { x: 3, y: 3 }, { x: 9, y: 3 }, { x: 3, y: 9 }, { x: 9, y: 9 },
                        { x: 6, y: 6 }, { x: 3, y: 6 }, { x: 9, y: 6 }, { x: 6, y: 3 }, { x: 6, y: 9 }
                    );
                } else if (this.size === 19) {
                    points.push(
                        { x: 3, y: 3 }, { x: 9, y: 3 }, { x: 15, y: 3 },
                        { x: 3, y: 9 }, { x: 9, y: 9 }, { x: 15, y: 9 },
                        { x: 3, y: 15 }, { x: 9, y: 15 }, { x: 15, y: 15 }
                    );
                }
                return points;
            }

            handleClick(x, y) {
                if (this.board[y][x] !== null) return;
                if (this.koPoint && this.koPoint.x === x && this.koPoint.y === y) return;

                // Try placing the stone
                const opponent = this.currentPlayer === 'black' ? 'white' : 'black';
                this.board[y][x] = this.currentPlayer;

                // Check for captures
                const captured = this.checkCaptures(x, y, opponent);

                // Check if the move is suicide (no liberties and no captures)
                if (captured.length === 0 && !this.hasLiberties(x, y)) {
                    this.board[y][x] = null;
                    return;
                }

                // Remove captured stones
                captured.forEach(pos => {
                    this.board[pos.y][pos.x] = null;
                });

                // Update captures count
                this.captures[this.currentPlayer] += captured.length;

                // Check for ko
                this.koPoint = null;
                if (captured.length === 1) {
                    const capturedPos = captured[0];
                    // Check if placing a stone at captured position would recreate the previous board state
                    const tempBoard = JSON.stringify(this.board);
                    this.board[capturedPos.y][capturedPos.x] = opponent;
                    if (this.getGroupLiberties(capturedPos.x, capturedPos.y).length === 1) {
                        this.koPoint = { x: capturedPos.x, y: capturedPos.y };
                    }
                    this.board[capturedPos.y][capturedPos.x] = null;
                }

                // Update last move
                this.lastMove = { x, y };
                this.passCount = 0;

                // Switch player
                this.currentPlayer = opponent;
                this.saveState();
                this.updateUI();
                this.updateBoardDisplay();
            }

            checkCaptures(x, y, opponent) {
                const captured = [];
                const directions = [
                    { dx: 0, dy: -1 },
                    { dx: 0, dy: 1 },
                    { dx: -1, dy: 0 },
                    { dx: 1, dy: 0 }
                ];

                directions.forEach(dir => {
                    const nx = x + dir.dx;
                    const ny = y + dir.dy;
                    if (this.isValidPos(nx, ny) && this.board[ny][nx] === opponent) {
                        if (!this.hasLiberties(nx, ny)) {
                            const group = this.getGroup(nx, ny);
                            group.forEach(pos => {
                                if (!captured.some(c => c.x === pos.x && c.y === pos.y)) {
                                    captured.push(pos);
                                }
                            });
                        }
                    }
                });

                return captured;
            }

            hasLiberties(x, y) {
                return this.getGroupLiberties(x, y).length > 0;
            }

            getGroupLiberties(x, y) {
                const group = this.getGroup(x, y);
                const liberties = [];
                const directions = [
                    { dx: 0, dy: -1 },
                    { dx: 0, dy: 1 },
                    { dx: -1, dy: 0 },
                    { dx: 1, dy: 0 }
                ];

                group.forEach(pos => {
                    directions.forEach(dir => {
                        const nx = pos.x + dir.dx;
                        const ny = pos.y + dir.dy;
                        if (this.isValidPos(nx, ny) && this.board[ny][nx] === null) {
                            if (!liberties.some(l => l.x === nx && l.y === ny)) {
                                liberties.push({ x: nx, y: ny });
                            }
                        }
                    });
                });

                return liberties;
            }

            getGroup(x, y) {
                const color = this.board[y][x];
                const group = [];
                const visited = new Set();
                const stack = [{ x, y }];

                while (stack.length > 0) {
                    const pos = stack.pop();
                    const key = `${pos.x},${pos.y}`;
                    if (visited.has(key)) continue;
                    visited.add(key);

                    if (!this.isValidPos(pos.x, pos.y)) continue;
                    if (this.board[pos.y][pos.x] !== color) continue;

                    group.push(pos);

                    stack.push({ x: pos.x, y: pos.y - 1 });
                    stack.push({ x: pos.x, y: pos.y + 1 });
                    stack.push({ x: pos.x - 1, y: pos.y });
                    stack.push({ x: pos.x + 1, y: pos.y });
                }

                return group;
            }

            isValidPos(x, y) {
                return x >= 0 && x < this.size && y >= 0 && y < this.size;
            }

            handleHover(cell) {
                const preview = cell.querySelector('.preview');
                if (preview) {
                    preview.className = `stone preview ${this.currentPlayer}`;
                }
            }

            handleHoverEnd(cell) {
                // Preview handled by CSS
            }

            updateBoardDisplay() {
                const cells = document.querySelectorAll('.cell');
                cells.forEach(cell => {
                    const x = parseInt(cell.dataset.x);
                    const y = parseInt(cell.dataset.y);
                    const stone = this.board[y][x];

                    // Remove existing placed stone
                    const existingStone = cell.querySelector('.stone:not(.preview)');
                    if (existingStone) existingStone.remove();

                    // Update preview
                    const preview = cell.querySelector('.preview');
                    if (preview) {
                        preview.className = `stone preview ${this.currentPlayer}`;
                        preview.style.display = stone ? 'none' : '';
                    }

                    // Add stone if present
                    if (stone) {
                        const stoneEl = document.createElement('div');
                        stoneEl.className = `stone ${stone}`;
                        if (this.lastMove && this.lastMove.x === x && this.lastMove.y === y) {
                            stoneEl.classList.add('last-move');
                        }
                        cell.appendChild(stoneEl);
                    }
                });
            }

            updateUI() {
                const turnStone = document.getElementById('turn-stone');
                const turnText = document.getElementById('turn-text');
                turnStone.className = `turn-stone ${this.currentPlayer}`;
                turnText.textContent = `${this.currentPlayer.charAt(0).toUpperCase() + this.currentPlayer.slice(1)}'s turn`;

                document.getElementById('black-captures').textContent = this.captures.black;
                document.getElementById('white-captures').textContent = this.captures.white;
            }

            pass() {
                this.passCount++;
                this.koPoint = null;
                this.lastMove = null;

                if (this.passCount >= 2) {
                    this.endGame();
                    return;
                }

                this.currentPlayer = this.currentPlayer === 'black' ? 'white' : 'black';
                this.saveState();
                this.updateUI();
            }

            endGame() {
                const score = this.calculateScore();
                const result = document.getElementById('game-result');

                if (score.black > score.white) {
                    result.textContent = `Black wins! (Black: ${score.black}, White: ${score.white})`;
                } else if (score.white > score.black) {
                    result.textContent = `White wins! (Black: ${score.black}, White: ${score.white})`;
                } else {
                    result.textContent = `It's a tie! (Both: ${score.black})`;
                }

                document.getElementById('game-over').classList.remove('hidden');
            }

            calculateScore() {
                // Simple territory counting (Chinese rules approximation)
                const visited = new Set();
                let blackScore = this.captures.black;
                let whiteScore = this.captures.white + 6.5; // Komi for white

                // Count stones on board
                for (let y = 0; y < this.size; y++) {
                    for (let x = 0; x < this.size; x++) {
                        if (this.board[y][x] === 'black') blackScore++;
                        else if (this.board[y][x] === 'white') whiteScore++;
                    }
                }

                // Count territory (empty points surrounded by one color)
                for (let y = 0; y < this.size; y++) {
                    for (let x = 0; x < this.size; x++) {
                        const key = `${x},${y}`;
                        if (this.board[y][x] === null && !visited.has(key)) {
                            const territory = this.getTerritory(x, y, visited);
                            if (territory.owner === 'black') blackScore += territory.points;
                            else if (territory.owner === 'white') whiteScore += territory.points;
                        }
                    }
                }

                return { black: blackScore, white: whiteScore };
            }

            getTerritory(startX, startY, visited) {
                const territory = [];
                const borders = new Set();
                const stack = [{ x: startX, y: startY }];

                while (stack.length > 0) {
                    const pos = stack.pop();
                    const key = `${pos.x},${pos.y}`;

                    if (visited.has(key)) continue;
                    if (!this.isValidPos(pos.x, pos.y)) continue;

                    const cell = this.board[pos.y][pos.x];

                    if (cell !== null) {
                        borders.add(cell);
                        continue;
                    }

                    visited.add(key);
                    territory.push(pos);

                    stack.push({ x: pos.x, y: pos.y - 1 });
                    stack.push({ x: pos.x, y: pos.y + 1 });
                    stack.push({ x: pos.x - 1, y: pos.y });
                    stack.push({ x: pos.x + 1, y: pos.y });
                }

                let owner = null;
                if (borders.size === 1) {
                    owner = [...borders][0];
                }

                return { points: territory.length, owner };
            }

            setSize(size) {
                this.size = size;
                this.init();
            }
        }

        // Initialize game
        const game = new GoGame(13);

        // Event listeners
        document.getElementById('prev-btn').addEventListener('click', () => game.previousMove());
        document.getElementById('next-btn').addEventListener('click', () => game.nextMove());
        document.getElementById('pass-btn').addEventListener('click', () => game.pass());
        document.getElementById('reset-btn').addEventListener('click', () => game.init());
        document.getElementById('new-game-btn').addEventListener('click', () => {
            document.getElementById('game-over').classList.add('hidden');
            game.init();
        });

        document.querySelectorAll('.btn-size').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.btn-size').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                game.setSize(parseInt(btn.dataset.size));
            });
        });
    </script>
</body>
</html>
